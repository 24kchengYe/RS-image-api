[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "rs-image-api"
version = "0.2.0"
description = "Multi-source satellite imagery downloader with Google Earth Historical support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "24kchengYe"}]
dependencies = [
    "requests>=2.28.0",
    "Pillow>=9.0.0",
    "geopandas>=0.12.0",
]

[project.optional-dependencies]
rasterio = ["rasterio>=1.3.0"]

[project.scripts]
rs-image = "rs_image_api.cli:main"

[project.urls]
Repository = "https://github.com/24kchengYe/RS-image-api"
